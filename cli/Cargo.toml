[package]
name = "cargo-tangle"
version = "0.5.0-alpha.26"
description = "A command-line tool to create and deploy blueprints on Tangle Network"
authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
blueprint-core = { workspace = true, features = ["tracing"] }
blueprint-runner = { workspace = true, features = ["networking", "tangle"] }
blueprint-std = { workspace = true, features = ["std"] }
blueprint-chain-setup = { workspace = true, features = ["anvil", "std"] }
blueprint-testing-utils = { workspace = true, features = ["anvil"] }
blueprint-contexts = { workspace = true }
blueprint-clients = { workspace = true, features = ["tangle", "evm", "std"] }
blueprint-client-tangle = { workspace = true, features = ["std"] }
blueprint-remote-providers = { workspace = true, optional = true }
blueprint-crypto = { workspace = true, features = [
    "k256",
    "bls",
    "bn254",
] }
blueprint-crypto-core = { workspace = true, features = ["clap"] }
blueprint-keystore = { workspace = true, features = [
    "bls",
    "bn254",
    "evm",
    "sr25519-schnorrkel",
    "std",
    "zebra",
] }
blueprint-manager = { workspace = true, features = ["containers", "tee"] }

anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "wrap_help"] }
clap-cargo = { workspace = true, features = ["clap"] }
cargo-generate = { workspace = true, features = ["vendored-libgit2"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "ansi"] }
color-eyre = { workspace = true, features = ["color-spantrace", "track-caller"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["alloc", "preserve_order"] }
serde_yaml = { workspace = true }
tokio = { workspace = true, features = ["full"] }
hex = { workspace = true }
tracing = { workspace = true, features = ["log"] }
thiserror = { workspace = true }
colored = { workspace = true }
futures = { workspace = true }
bip39 = { workspace = true, features = ["rand_core", "rand"] }
dotenv = { workspace = true }
url = { workspace = true }
rustls = { workspace = true }
toml = { workspace = true }
indicatif = { workspace = true }
dialoguer = { workspace = true, default-features = true }
blueprint-evm-extra = { workspace = true }
testcontainers = { workspace = true }
tempfile = { workspace = true }
alloy-json-abi = { workspace = true, features = ["serde_json"] }
alloy-network = { workspace = true }
alloy-sol-types = { workspace = true }
alloy-signer-local = { workspace = true }
alloy-primitives = { workspace = true }
alloy-contract = { workspace = true }
alloy-provider = { workspace = true }
alloy-transport = { workspace = true }
# Published blueprint dependencies allow newer Alloy v2 releases that exceed our Rust 1.93 MSRV.
# Keep their shared v2 graph on the source-tested release for fresh registry installs.
alloy-eips-v2 = { package = "alloy-eips", version = "=2.0.5", default-features = false }
alloy-json-rpc-v2 = { package = "alloy-json-rpc", version = "=2.0.5", default-features = false }
alloy-rpc-client-v2 = { package = "alloy-rpc-client", version = "=2.0.5", default-features = false }
alloy-transport-v2 = { package = "alloy-transport", version = "=2.0.5", default-features = false }
alloy-transport-http-v2 = { package = "alloy-transport-http", version = "=2.0.5", default-features = false }
alloy-rpc-types-eth = { workspace = true }
alloy-dyn-abi = { workspace = true }
reqwest = { workspace = true, features = ["multipart", "json", "rustls-tls"] }
sha2 = { workspace = true, features = ["std"] }
nix = { workspace = true, features = ["process", "signal", "ioctl", "term", "fs"] }
walkdir = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
rand = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }

[dev-dependencies]
# Path-only dev-deps to break publish cycles via testing-utils -> client-tangle -> cargo-tangle.
# Cargo strips path-only dev-deps from published manifests.
blueprint-keystore = { path = "../crates/keystore", features = ["bn254"] }
tempfile = { workspace = true }
blueprint-testing-utils = { path = "../crates/testing-utils", features = ["anvil"] }
alloy-contract = { workspace = true }
assert_cmd = "2.0"

[features]
default = []
vm-debug = ["blueprint-manager/vm-sandbox"]
remote-providers = ["dep:blueprint-remote-providers", "blueprint-manager/remote-providers"]

[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# CI backends to support
ci = "github"
# Whether dist should create a Github Release or use an existing draft
create-release = false
github-build-setup = "build-setup.yml"
# `release.yml` carries two edits that `dist` cannot express through config: a
# `retention-days` limit on the `cargo-dist-cache` upload. Without that limit
# the artifact holds most of the organization Actions storage allowance.
# The second edit limits distribution to cargo-tangle tags while release-plz owns libraries.
# `github-build-setup` reaches the build jobs only, not the `plan` job that
# makes the upload, so the edit must stay in `release.yml`.
#
# `dist plan` compares `release.yml` against its generated form and stops with
# exit 255 when they differ. This key tells it to accept the difference.
# Compare `release.yml` against `dist generate` output by hand after you change
# `cargo-dist-version`, because this key stops the automatic comparison.
allow-dirty = ["ci"]
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax).
# x86_64-apple-darwin is intentionally omitted: GitHub's macos-13 runner
# pool is scarce (jobs routinely queue for 30+ min), Apple stopped
# shipping Intel Macs in 2023, and Rosetta 2 runs the aarch64 binary
# transparently on the remaining Intel users. Add back only if a real
# user reports an aarch64-on-Intel regression.
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = true
bin-aliases = { cargo-tangle = ["tangle", "tg"] }
members = ["cargo:/cli"]
# Which actions to run on pull requests
pr-run-mode = "plan"
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.28.7-prerelease.1"

[dist.github-custom-runners]
global = "ci-public"
# Custom runners to use for each target platform
aarch64-apple-darwin = "macos-15"
x86_64-unknown-linux-gnu = "ci-public"
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"

[package]
name = "blueprint-manager"
version = "0.4.0-alpha.22"
description = "Tangle Blueprint manager and Runner"
authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "blueprint-manager"
path = "src/main.rs"

[dependencies]
blueprint-core = { workspace = true, features = ["tracing"] }
tracing = { workspace = true }
blueprint-runner = { workspace = true, features = ["networking", "tangle", "std"] }
blueprint-clients = { workspace = true, features = ["std", "tangle"] }
blueprint-client-tangle = { workspace = true }
blueprint-crypto = { workspace = true, features = ["std"] }
blueprint-keystore = { workspace = true, features = ["std", "evm"] }
blueprint-std = { workspace = true, features = ["std"] }
blueprint-auth = { workspace = true, features = ["std"] }
blueprint-manager-bridge = { workspace = true, features = ["tracing", "server"] }
blueprint-testing-utils = { workspace = true, features = [] }
blueprint-chain-setup = { workspace = true, features = ["anvil"] }
blueprint-remote-providers = { workspace = true, optional = true }
blueprint-qos = { workspace = true, optional = true }
blueprint-pricing-engine = { workspace = true, optional = true }
blueprint-profiling = { workspace = true, optional = true }
blueprint-faas = { workspace = true, optional = true, default-features = false }

alloy-provider = { workspace = true }
alloy-rpc-types = { workspace = true }
alloy-transport-http = { workspace = true }
alloy-primitives = { workspace = true }
alloy-sol-types = { workspace = true }
alloy-contract = { workspace = true }


serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["serde", "clock"] }
document-features.workspace = true
async-trait = { workspace = true }
axum = { workspace = true, default-features = false, features = ["json", "tokio", "http2"] }
prometheus = { workspace = true }
docktopus = { workspace = true, features = ["deploy"] }
clap = { workspace = true, features = ["derive", "wrap_help"] }
color-eyre = { workspace = true, features = ["tracing-error", "color-spantrace", "issue-url"] }
toml = { workspace = true, features = ["parse", "serde"] }
hex = { workspace = true }
blake3 = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "process", "io-util", "signal", "macros"] }
reqwest = { workspace = true }
sha2 = { workspace = true }
futures = { workspace = true }
thiserror.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "ansi", "tracing-log"] }
auto_impl = { workspace = true }
dynosaur = { workspace = true }
url.workspace = true
base64 = { workspace = true }
flate2 = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
hyper.workspace = true
hyperlocal.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
dirs.workspace = true
walkdir.workspace = true
tempfile = { workspace = true }
rustls = { workspace = true, features = ["aws-lc-rs"] }

# Binary extraction
cargo-dist-schema.workspace = true
tar.workspace = true
xz.workspace = true

# VM Sandbox
cloud-hypervisor-client = { workspace = true, optional = true }
fatfs = { workspace = true, features = ["std"], optional = true }
nix = { workspace = true, features = ["process", "signal", "ioctl", "term", "fs"], optional = true }
capctl = { workspace = true, features = ["std"], optional = true }

# TEE
kube = { workspace = true, features = ["client", "rustls-tls"], optional = true }
k8s-openapi = { workspace = true, features = ["latest"], optional = true }
local-ip-address.workspace = true

## Networking
rtnetlink = { workspace = true, features = ["tokio_socket"], optional = true }
ipnet = { workspace = true, optional = true }
netdev = { workspace = true, features = ["gateway"], optional = true }
nftables = { workspace = true, optional = true }

[features]
default = ["containers"]

## Enable remote cloud deployment functionality
##
## This feature enables deployment to cloud providers like AWS, GCP, Azure, DigitalOcean, and Vultr.
## It includes real SDK integrations for provisioning instances and deploying Blueprint services.
# `blueprint-remote-providers/tee-attestation` ships the require_tee verifier (JWT
# path for GCP/Azure, no extra deps) so a require_tee deployment is genuinely
# attested instead of fail-closed-erroring in the shipped manager. The AWS Nitro
# COSE verifier remains opt-in via `tee-attestation-nitro`.
remote-providers = [
    "dep:blueprint-remote-providers",
    "blueprint-remote-providers/std",
    "blueprint-remote-providers/tee-attestation",
    "dep:blueprint-pricing-engine",
    "dep:blueprint-profiling",
]

## Enable QoS monitoring for local and remote instances
qos = ["dep:blueprint-qos"]

## macOS-friendly development feature (excludes Linux-only vm-sandbox)
macos-dev = ["remote-providers", "qos"]

## Enable the VM sandbox
##
## **NOTE**: This is only supported on Linux
##
## Enabling this will also add additional CLI options: `--no-vm`, `--network-interface`, and `--default-address-pool`
vm-sandbox = ["dep:cloud-hypervisor-client", "dep:fatfs", "dep:nix", "dep:capctl", "dep:rtnetlink", "dep:ipnet", "dep:netdev", "dep:nftables"]

## Enable TEE (Trusted Execution Environment) support
tee = ["blueprint-runner/tee"]

## Enable containerized blueprints through [Kubernetes] and [kata-containers]
##
## Enabling this will also add additional CLI options:
##
## [kubernetes]: https://kubernetes.io/
## [kata-containers]: https://katacontainers.io/
containers = ["dep:kube", "dep:k8s-openapi"]

# Optional integrations toggled by remote serverless modules
tangle-client = []
blueprint-faas = ["dep:blueprint-faas"]
aws = ["blueprint-faas", "blueprint-faas/aws"]
gcp = ["blueprint-faas", "blueprint-faas/gcp"]
azure = ["blueprint-faas", "blueprint-faas/azure"]
custom = ["blueprint-faas", "blueprint-faas/custom"]
digitalocean = ["blueprint-faas", "blueprint-faas/digitalocean"]

[package.metadata.dist]
dist = false

[dev-dependencies]
alloy-network = { workspace = true }
alloy-provider = { workspace = true }
alloy-rpc-types = { workspace = true }
alloy-signer-local = { workspace = true }
# Path-only dev-deps to break publish cycles via testing-utils -> runner -> manager.
# Cargo strips path-only dev-deps from published manifests.
blueprint-auth = { path = "../auth" }
blueprint-manager-bridge = { path = "bridge" }
futures-util = { workspace = true }
tower = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
blueprint-anvil-testing-utils = { path = "../testing-utils/anvil" }
blueprint-router = { path = "../router" }
blueprint-tangle-extra = { path = "../tangle-extra" }
xz2 = { workspace = true }
serial_test = { workspace = true }
rand = { workspace = true }

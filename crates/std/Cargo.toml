[package]
name = "blueprint-std"
version = "0.2.0-alpha.8"
description = "Re-exports of core/std for Tangle Blueprints"
authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
rand = { workspace = true, features = ["std_rng"] }
# Bridges consumers still on the rand 0.6/0.8-era API (rand_core 0.6) to the OS RNG above.
rand_core06 = { package = "rand_core", version = "0.6", optional = true }
rayon = { workspace = true, optional = true }
num-traits.workspace = true
thiserror.workspace = true
# `colored` has no `no_std` support, and it is only referenced from
# `perf_trace`, which is gated behind `print-trace` (itself `std`-only).
# Keeping it non-optional here pulls `std` into every `no_std` consumer of
# this crate through the unconditional dependency edge.
colored = { workspace = true, optional = true }

[dev-dependencies]
rand = { workspace = true, features = ["std"] }

[features]
default = ["std"]
std = ["thiserror/std", "dep:rand_core06", "rand/sys_rng"]
parallel = ["dep:rayon", "std"]
print-trace = ["std", "dep:colored"]

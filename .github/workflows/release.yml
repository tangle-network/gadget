# Native release execution is owned by release-trusted.yml on main.
name: Release

on:
  pull_request:
  push:
    tags:
      - 'cargo-tangle-v*'

permissions:
  contents: read

jobs:
  plan-pr:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, ci-public]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        # we specify bash to get pipefail; it guards against the `curl` command
        # failing. otherwise `sh` won't catch that `curl` returned non-0
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/astral-sh/cargo-dist/releases/download/v0.28.7-prerelease.1/cargo-dist-installer.sh | sh"
      - name: Validate the distribution plan
        run: dist plan --output-format=json

  release:
    if: github.event_name == 'push'
    uses: tangle-network/blueprint/.github/workflows/release-trusted.yml@main
    permissions:
      contents: write
    with:
      source_sha: ${{ github.sha }}

# Build prerequisites for cargo-dist's cargo-tangle artifact jobs.

- name: Verify protobuf and gmp (Linux)
  if: runner.os == 'Linux'
  run: |
    protoc --version
    pkg-config --exists protobuf gmp

- name: install protobuf and gmp (macOS)
  if: runner.os == 'macOS'
  run: |
    brew install protobuf gmp
    echo "Installed protobuf and gmp on macOS"

- name: Install LLVM and Clang
  uses: KyleMayes/install-llvm-action@v2
  with:
    version: "19.1.7"
